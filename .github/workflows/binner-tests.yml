name: Binner Runtime Tests

on:
  pull_request:
    paths:
      - "preprocessing/binner.py"
      - "experimental/binner.py"
      - "tests/test_binner.py"
      - ".github/workflows/binner-tests.yml"
  push:
    branches: [main]
    paths:
      - "preprocessing/binner.py"
      - "experimental/binner.py"
      - "tests/test_binner.py"
      - ".github/workflows/binner-tests.yml"
  workflow_dispatch:

jobs:
  test-binner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn matplotlib optbinning pytest
      - name: Run binner runtime tests
        run: python -m pytest -q tests/test_binner.py
